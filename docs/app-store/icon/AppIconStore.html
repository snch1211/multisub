<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:1024px;background:transparent}
.tile{position:absolute;left:100px;top:100px;width:824px;height:824px;border-radius:185px;
 background:linear-gradient(135deg,#1a1920 0%,#24151b 45%,#5e0d17 100%);
 box-shadow:0 20px 40px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.08), inset 0 0 0 1px rgba(255,255,255,.05);overflow:hidden}
.glow{position:absolute;left:-120px;top:-160px;width:700px;height:520px;border-radius:50%;
 background:radial-gradient(closest-side,rgba(255,255,255,.07),rgba(255,255,255,0));}
.bars{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:54px;padding-top:6px}
.b1{width:590px;height:156px;border-radius:52px;background:linear-gradient(180deg,#ffffff,#e9e9ee);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.b2{width:420px;height:140px;border-radius:48px;background:linear-gradient(180deg,#ff3b46,#e0202c);box-shadow:0 10px 24px rgba(120,0,10,.45)}
.b1,.b2{display:flex;align-items:center;justify-content:center;font-family:-apple-system,"SF Pro Display","PingFang TC",sans-serif;font-weight:800}.b1 span{font-size:112px;color:#1d1b22;letter-spacing:-2px}.b2 span{font-size:96px;color:#fff}</style></head><body><div class="tile"><div class="glow"></div><div class="bars"><div class="b1"><span>Aa</span></div><div class="b2"><span>文</span></div></div></div></body></html>
