<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Netflix</title>
<!--
  A mock Netflix watch page for tests/webkit (harness watch). The harness
  serves it at http(s)://www.netflix.com/watch/<movieId> and replaces the
  FIXTURE placeholder below with { movieId, manifestURL, manifestMethod,
  subsURL, video }: URLs on the harness's loopback server, or data: URLs
  for an https page.

  It reproduces what extension/inject.js and extension/content.js rely on:
  - the player fetches its manifest as JSON (Response.json, or JSON.parse
    when fixture.manifestVia is "parse") with params.profiles, so the
    JSON.stringify hook can add the WebVTT profile;
  - the manifest lists timedtexttracks with download URLs;
  - window.netflix.appContext.state.playerApp.getAPI() answers for the
    selected subtitle/audio track and the title;
  - <video> inside .watch-video, Netflix's own line in .player-timedtext.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  .watch-video { position: relative; width: 100%; height: 100%; }
  .watch-video--player-view { position: absolute; inset: 0; }
  .VideoContainer, .VideoContainer > div { position: absolute; inset: 0; }
  video { width: 100%; height: 100%; object-fit: contain; background: #1d2330; }
  .player-timedtext { position: absolute; left: 0; right: 0; bottom: 18%; text-align: center; pointer-events: none; }
  .player-timedtext-text-container { display: inline-block; }
  .player-timedtext-text-container span { font: 600 28px/1.3 -apple-system, "Helvetica Neue", sans-serif; color: #fff; text-shadow: 0 0 6px #000; }
  .title-card { position: absolute; top: 16px; left: 20px; font: 600 16px -apple-system, sans-serif; color: rgba(255,255,255,.75); }
</style>
</head>
<body>
<div class="watch-video" data-uia="watch-video">
  <div class="watch-video--player-view" data-uia="watch-video-player-view-minimized">
    <div data-uia="video-canvas" class="VideoContainer">
      <div><video muted playsinline preload="auto"></video></div>
    </div>
    <div class="player-timedtext"></div>
    <div class="title-card">Harness Show: S1:E1 "Pilot"</div>
  </div>
</div>
<script>
(function () {
  'use strict';
  const FX = /*FIXTURE*/{ "movieId": "80000001", "manifestURL": "", "manifestMethod": "POST", "subsURL": "", "video": null }/*END*/;
  const nativeParse = /\[native code\]/.test(Function.prototype.toString.call(JSON.parse));
  const state = window.__fixture = {
    // inject.js (world MAIN, document_start) hooks JSON.parse before any
    // page script runs; false here means it came in later (or not at all).
    hookedBeforePage: !nativeParse,
    manifestFetched: false,
    events: []
  };
  const video = document.querySelector('video');

  // --- Netflix's private player API, as far as inject.js reads it.
  const track = { bcp47: 'en', displayName: 'English', isForcedNarrative: false, isNoneTrack: false };
  const player = {
    getMovieId: () => Number(FX.movieId),
    getTimedTextTrack: () => track,
    getAudioTrack: () => ({ bcp47: 'en', displayName: 'English [Original]' })
  };
  const current = {
    getTitle: () => 'Harness Show', isEpisodic: () => true, getEpisodeTitle: () => 'Pilot',
    getSeason: () => ({ _season: { seq: 1 } }), getEpisodeNumber: () => 1
  };
  const api = {
    videoPlayer: { getAllPlayerSessionIds: () => ['watch-1'], getVideoPlayerBySessionId: () => player },
    getVideoMetadataByVideoId: () => ({ getCurrentVideo: () => current })
  };
  window.netflix = { appContext: { state: { playerApp: { getAPI: () => api } } } };

  // --- Media time. With a media file the harness seeks the real element;
  // without one, currentTime set before any media loads is kept as the
  // default playback start position and read back as is.
  if (FX.video) video.src = FX.video;
  state.ready = new Promise((resolve) => {
    if (!FX.video) { resolve('scripted'); return; }
    if (video.readyState >= 1) { resolve('media'); return; }
    video.addEventListener('loadedmetadata', () => resolve('media'), { once: true });
    video.addEventListener('error', () => resolve('media-error'), { once: true });
    setTimeout(() => resolve('media-timeout'), 8000);
  });
  state.seek = async function (t) {
    const how = await state.ready;
    if (how === 'media' && Math.abs(video.currentTime - t) > 0.01) {
      await new Promise((resolve) => {
        video.addEventListener('seeked', resolve, { once: true });
        setTimeout(resolve, 3000);
        video.currentTime = t;
      });
    } else if (how !== 'media') {
      video.currentTime = t;
    }
    return { how: how, currentTime: video.currentTime, readyState: video.readyState, duration: video.duration };
  };

  // --- The player boots after the page and asks for its manifest.
  setTimeout(async function () {
    state.events.push('player: booting');
    try {
      const body = JSON.stringify({
        version: 2, url: 'manifest', languages: ['en-US'],
        params: { viewableId: Number(FX.movieId), profiles: ['heaac-2-dash', 'playready-h264mpl30-dash', 'dfxp-ls-sdh', 'imsc1.1'] }
      });
      state.manifestRequestBody = body;
      state.events.push('manifest: requesting');
      const res = await fetch(FX.manifestURL, FX.manifestMethod === 'POST' ? { method: 'POST', body: body } : {});
      const via = FX.manifestVia === 'parse' ? 'JSON.parse' : 'Response.json';
      const manifest = via === 'JSON.parse' ? JSON.parse(await res.text()) : await res.json();
      state.manifestFetched = !!(manifest && manifest.result);
      state.events.push('manifest: ' + (state.manifestFetched ? 'loaded' : 'no result') + ' via ' + via);
      startNativeRenderer();
    } catch (e) {
      state.events.push('manifest failed: ' + e.message);
    }
  }, FX.manifestDelayMs || 400);

  // --- Netflix's own subtitle line (what MultiSub hides in merged layouts
  // and reads in its DOM fallback). Entities are stripped, as Netflix's
  // renderer would show them decoded.
  async function startNativeRenderer() {
    const box = document.querySelector('.player-timedtext');
    let cues = [];
    try {
      const text = await (await fetch(FX.subsURL)).text();
      const lines = text.replace(/\r/g, '').split('\n');
      const sec = (s) => s.split(':').reduce((acc, p) => acc * 60 + Number(p), 0);
      for (let i = 0; i < lines.length; i++) {
        const m = lines[i].match(/^([\d:.]+)\s+-->\s+([\d:.]+)/);
        if (!m) continue;
        const buf = [];
        for (i++; i < lines.length && lines[i].trim(); i++) {
          let l = lines[i].replace(/<[^>]*>/g, '');
          for (let k = 0; k < 2; k++) l = l.replace(/&amp;/gi, '&');
          buf.push(l.replace(/&[a-z0-9#]+;/gi, (e) => (e === '&#39;' ? "'" : '')));
        }
        cues.push({ start: sec(m[1]), end: sec(m[2]), lines: buf });
      }
    } catch (e) { state.events.push('native renderer: ' + e.message); }
    let shown = null;
    setInterval(function () {
      const t = video.currentTime;
      const cue = cues.find((c) => t >= c.start && t < c.end) || null;
      if (cue === shown) return;
      shown = cue;
      box.textContent = '';
      if (!cue) return;
      const container = document.createElement('div');
      container.className = 'player-timedtext-text-container';
      cue.lines.forEach((l, i) => {
        if (i) container.appendChild(document.createElement('br'));
        const span = document.createElement('span');
        span.textContent = l;
        container.appendChild(span);
      });
      box.appendChild(container);
    }, 100);
  }
})();
</script>
</body>
</html>
